name: Mini Runtime Roles Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mini-minilm-release
  cancel-in-progress: false
jobs:
  build-publish:
    if: github.repository == 'devitolo/paper-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      PYTHON_BASE: docker.io/library/python@sha256:2ed6491b93cd49272ee6de2b5a38440c3448360322c089fc23e370722d74179d
      NODE_BASE: docker.io/library/node@sha256:43aeff40f4afc22e83f7589a2f37e111cff5ca84529571f1c8415bcc5fcc21b2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify production runtime lifecycle and exact main source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tests/runtime_roles -v
          python3 -m unittest discover -s tests/nonprod_snapshot -v
          PYTHONPATH=tests python3 -W ignore::ResourceWarning -m unittest test_package_runtime test_migration_scheduler test_mini_release_pipeline -q
          git diff --check
      - name: Record source bundle
        id: source
        run: echo "bundle=$(git archive --format=tar HEAD | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish shared AMD64 role image
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: mini-production-http
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ghcr.io/devitolo/paper-agent:mini-roles-${{ github.sha }}
          build-args: |
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE }}
            NODE_BASE_IMAGE=${{ env.NODE_BASE }}
            VCS_REF=${{ github.sha }}
            VERSION=mini-roles-${{ github.sha }}
            SOURCE_BUNDLE_SHA256=${{ steps.source.outputs.bundle }}
      - name: Inspect immutable image and verify production runtime modules
        env:
          APP_IMAGE: ghcr.io/devitolo/paper-agent@${{ steps.app.outputs.digest }}
          SOURCE_BUNDLE: ${{ steps.source.outputs.bundle }}
        run: python3 scripts/qualify_role_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mini-role-release-${{ github.sha }}
          path: role-release-evidence.json
          if-no-files-found: error
          retention-days: 30
