services:
  app:
    image: ${PAPER_APP_IMAGE:?Set the selected application image reference}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPER_PORT:-8000}:8000"
    environment:
      PAPER_APP_IMAGE: ${PAPER_APP_IMAGE}
      PAPER_AGENT_PACKAGED: "1"
      PAPER_AGENT_GEMINI_ENABLED: "0"
      PAPER_AGENT_OLLAMA_URL: http://ollama:11434/api/generate
      PAPER_MODEL_CHECK_TIMEOUT: ${PAPER_MODEL_CHECK_TIMEOUT:-120}
    volumes:
      - paper-data:/app/data
      - paper-config:/app/config
    healthcheck:
      test: ["CMD", "python", "-m", "paper_agents.package_runtime", "check-app"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
  ollama:
    image: ${PAPER_OLLAMA_IMAGE:?Set an explicitly selected Ollama image reference}
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
  prepare-model:
    image: ${PAPER_APP_IMAGE:?Set the selected application image reference}
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    environment:
      PAPER_AGENT_PACKAGED: "1"
      PAPER_AGENT_OLLAMA_URL: http://ollama:11434/api/generate
      PAPER_MODEL_PREPARE_TIMEOUT: ${PAPER_MODEL_PREPARE_TIMEOUT:-1800}
      PAPER_MODEL_PULL_ATTEMPTS: ${PAPER_MODEL_PULL_ATTEMPTS:-2}
    entrypoint: ["python", "-m", "paper_agents.prepare_model"]
volumes:
  paper-data:
  paper-config:
  ollama-data:
