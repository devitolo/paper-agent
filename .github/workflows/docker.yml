name: Docker

on:
  push:
    tags:
      - "v*.*.*"
      - "mini-candidate-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish a Mini production candidate image for exact-image acceptance
        required: true
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PUBLIC_TARGET: runtime
  MINI_TARGET: mini-production
  RELEASE_EVENT_NAME: ${{ github.event_name }}
  RELEASE_REF_TYPE: ${{ github.ref_type }}
  RELEASE_REF_NAME: ${{ github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      publish_candidate: ${{ steps.release.outputs.publish_candidate }}
      source_bundle_sha256: ${{ steps.source.outputs.source_bundle_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          if [[ "$RELEASE_EVENT_NAME" == push && "$RELEASE_REF_TYPE" == tag && "$RELEASE_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release_tag=true" >> "$GITHUB_OUTPUT"
            echo "release_version=$RELEASE_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_EVENT_NAME" == push && "$RELEASE_REF_TYPE" == tag && "$RELEASE_REF_NAME" =~ ^mini-candidate-[0-9a-f]{7,40}$ ]]; then
            echo "release_tag=false" >> "$GITHUB_OUTPUT"
            echo "release_version=$RELEASE_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=false" >> "$GITHUB_OUTPUT"
            echo "release_version=mini-candidate-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$RELEASE_EVENT_NAME" == workflow_dispatch && "${{ inputs.publish_candidate }}" == true ]]; then
            echo "publish_candidate=true" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_EVENT_NAME" == push && "$RELEASE_REF_TYPE" == tag && "$RELEASE_REF_NAME" =~ ^mini-candidate-[0-9a-f]{7,40}$ ]]; then
            echo "publish_candidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_candidate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute source bundle hash
        id: source
        shell: bash
        run: |
          git archive --format=tar HEAD | sha256sum | awk '{ print "source_bundle_sha256=" $1 }' >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Validate public package build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ env.PUBLIC_TARGET }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.release.outputs.release_version }}

      - name: Validate Mini production build
        if: steps.release.outputs.publish_candidate != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ env.MINI_TARGET }}
          platforms: ${{ steps.release.outputs.release_tag == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          cache-from: |
            type=gha,scope=mini-production
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-mini
          cache-to: type=gha,mode=max,scope=mini-production
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.release.outputs.release_version }}
            SOURCE_BUNDLE_SHA256=${{ steps.source.outputs.source_bundle_sha256 }}

  publish:
    needs: validate
    if: needs.validate.outputs.release_tag == 'true' || needs.validate.outputs.publish_candidate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ needs.validate.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=mini-sha-
            type=raw,value=${{ needs.validate.outputs.release_version }}
            type=ref,event=tag,enable=${{ needs.validate.outputs.release_tag == 'true' }}

      - name: Build and publish Mini production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ env.MINI_TARGET }}
          platforms: ${{ needs.validate.outputs.release_tag == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          cache-from: |
            type=gha,scope=mini-production
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-mini
          cache-to: |
            type=gha,mode=max,scope=mini-production
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-mini,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.validate.outputs.release_version }}
            SOURCE_BUNDLE_SHA256=${{ needs.validate.outputs.source_bundle_sha256 }}
          provenance: mode=max
          sbom: true

      - name: Write image reference output
        id: ref
        shell: bash
        run: |
          echo "image_ref=${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Write release metadata
        run: |
          mkdir -p release-metadata
          cat > release-metadata/project-paper-${{ needs.validate.outputs.release_version }}.json <<'EOF'
          {
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",
            "version": "${{ needs.validate.outputs.release_version }}",
            "revision": "${{ github.sha }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "image_ref": "${{ steps.ref.outputs.image_ref }}",
            "target": "${{ env.MINI_TARGET }}",
            "source_bundle_sha256": "${{ needs.validate.outputs.source_bundle_sha256 }}",
            "promotion": "${{ needs.validate.outputs.release_tag == 'true' && 'release-tag' || 'candidate' }}",
            "platforms": ["linux/amd64", "linux/arm64"],
            "provenance": "build-push-action provenance attestation",
            "sbom": "build-push-action SPDX SBOM attestation"
          }
          EOF

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-paper-release-metadata-${{ needs.validate.outputs.release_version }}
          path: release-metadata/

  exact-image-acceptance:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mini registry acceptance
        env:
          PAPER_MINI_ACCEPTANCE_IMAGE: ${{ needs.publish.outputs.image_ref }}
          PAPER_MINI_EXPECTED_PLATFORMS: ${{ startsWith(needs.publish.outputs.version, 'v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        run: bash scripts/mini_registry_acceptance.sh

      - name: Upload Mini acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-paper-mini-registry-acceptance-${{ needs.publish.outputs.version }}
          path: release-acceptance-results/

  full-exact-image-acceptance:
    needs: [publish, exact-image-acceptance]
    if: needs.publish.result == 'success' && (needs.publish.outputs.version != '' && (startsWith(needs.publish.outputs.version, 'v') || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Full Mini exact-image acceptance
        env:
          PAPER_MINI_ACCEPTANCE_IMAGE: ${{ needs.publish.outputs.image_ref }}
          PAPER_MINI_ACCEPTANCE_VERSION: ${{ needs.publish.outputs.version }}
        run: bash scripts/mini_release_acceptance.sh
      - name: Upload full acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-paper-mini-full-acceptance-${{ needs.publish.outputs.version }}
          path: release-acceptance-results/

  deploy-mini-candidate:
    needs: [publish, exact-image-acceptance]
    if: needs.publish.result == 'success' && needs.exact-image-acceptance.result == 'success' && needs.publish.outputs.version != '' && (startsWith(needs.publish.outputs.version, 'mini-candidate-') || github.event_name == 'workflow_dispatch')
    runs-on:
      - self-hosted
      - project-paper-mini
      - linux
      - x64
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    environment:
      name: mini-production
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Confirm production runner identity
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          docker version
          docker compose version
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy exact published digest to Mini
        env:
          PAPER_MINI_APP_IMAGE: ${{ needs.publish.outputs.image_ref }}
          PAPER_MINI_DEPLOY_BRANCH: mini-production
          PAPER_MINI_DRAIN_TIMEOUT: "1800"
        run: bash scripts/mini_production_update.sh
