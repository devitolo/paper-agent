name: Project Paper Observability Release

on:
  push:
    tags:
      - 'observability-mini'
      - 'observability-aws'

permissions: {}
concurrency:
  group: project-paper-observability-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate standalone package
        run: |
          python3 -m unittest tests.test_mini_container_telemetry tests.test_host_resource_collector tests.test_resource_status tests.test_observability_release tests.test_observability_container tests.test_observability_aws_p1 tests.test_observability_collect_publish tests.test_observability_transport tests.test_disk_provenance tests.test_observability_host_package_build tests.test_observability_bootstrap_build tests.test_observability_host_package_policy tests.test_observability_updater_workflow -v
          bash -n scripts/resource_collector_job.sh scripts/install_resource_collector_cron.sh scripts/remove_resource_collector_cron.sh deploy/observability/*.sh
          test -s deploy/observability/Dockerfile
          test -s deploy/observability/entrypoint.sh
          test -s deploy/observability/run-container.sh
          git diff --check

      - name: Validate guarded transaction and bootstrap in disposable Linux
        run: |
          docker run --rm --platform linux/amd64 --user 0:0 --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid --tmpfs /qa-state:rw,exec,nosuid,mode=0755 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/qa-source,readonly" \
            --workdir /qa-source -e PAPER_OBSERVABILITY_QA_ISOLATED=1 \
            --entrypoint python3 \
            python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704 \
            -B -m unittest tests.test_observability_host_package_linux_qa tests.test_observability_host_bootstrap_linux_qa tests.test_guarded_updater_adversarial_linux_qa -v

  package:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      image: ${{ steps.image.outputs.image }}
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: archive
        name: Build immutable observability package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-observability-${GITHUB_SHA}}"
          archive="project-paper-observability-${tag}.tar.gz"
          tar -czf "$archive" scripts/host_resource_collector.py deploy/observability/Dockerfile deploy/observability/entrypoint.sh deploy/observability/run-container.sh deploy/observability/install_container_cron.sh deploy/observability/remove_container_cron.sh deploy/observability/recovery-common.sh deploy/observability/cron.example deploy/observability/project-paper-observability-deploy deploy/observability/sudoers.project-paper-observability deploy/observability/collect-publish.sh deploy/observability/publish.sh deploy/observability/install_single_image_wrapper.py paper_agents/__init__.py paper_agents/observability_transport.py paper_agents/observability_publisher.py paper_agents/container_telemetry.py docs/observability-single-image.md docs/mini-resource-collector-operations.md
          sha=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          printf 'package=%s\nsha256=%s\nrevision=%s\n' "$archive" "$sha" "$GITHUB_SHA" > observability-release-evidence.txt
      - id: image
        name: Build and publish immutable AMD64 image
        shell: bash
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/observability:${GITHUB_REF_NAME}"
          printf '%s' "$CR_PAT" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build --platform linux/amd64 --push --build-arg VCS_REF="$GITHUB_SHA" -f deploy/observability/Dockerfile -t "$image" .
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [[ "$digest" = sha256:* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'image=%s@%s\n' "$image" "$digest" >> observability-release-evidence.txt
          if [[ "$GITHUB_REF_NAME" == observability-mini ]]; then
            python3 scripts/build_observability_host_package.py --source-sha "$GITHUB_SHA" --image "$image@$digest" --output-directory host-package
          fi
      - id: attest_host
        if: github.ref_name == 'observability-mini'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            host-package/artifact.tar
            host-package/manifest.json
      - if: github.ref_name == 'observability-mini'
        run: cp "${{ steps.attest_host.outputs.bundle-path }}" host-package/attestation.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-paper-observability-${{ github.sha }}
          path: |
            ${{ steps.archive.outputs.archive }}
            observability-release-evidence.txt
            host-package/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: package
    if: needs.package.result == 'success' && github.event_name == 'push' && (github.ref_name == 'observability-mini' || github.ref_name == 'observability-aws')
    environment:
      name: ${{ github.ref_name == 'observability-mini' && 'observability-mini-production' || 'observability-aws-production' }}
    runs-on: ${{ github.ref_name == 'observability-mini' && fromJSON('["self-hosted","linux","x64","project-paper-observability-mini-deploy"]') || fromJSON('["self-hosted","linux","x64","project-paper-observability-aws-deploy"]') }}
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Select unique package staging directory
        shell: bash
        run: echo "OBSERVABILITY_PACKAGE_DIR=$RUNNER_TEMP/project-paper-observability-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: project-paper-observability-${{ github.sha }}
          path: ${{ env.OBSERVABILITY_PACKAGE_DIR }}
      - name: Require explicit release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" = tag ]] || { echo 'observability deploy requires a target-specific tag' >&2; exit 64; }
          case "$GITHUB_REF_NAME" in
            observability-mini) target=mini-production ;;
            observability-aws) target=aws-production ;;
            *) echo 'tag must be exactly observability-mini or observability-aws' >&2; exit 64 ;;
          esac
          echo "target=$target"
          echo "target=$target" >> "$GITHUB_ENV"
      - name: Check host resources and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v sudo >/dev/null
          command -v docker >/dev/null
          command -v flock >/dev/null
          df -Pk /var/lib /opt /etc
          free -b || true
      - name: Deploy package through host installer
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find "$OBSERVABILITY_PACKAGE_DIR" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          expected='${{ needs.package.outputs.sha256 }}'
          actual=$(sha256sum "$archive" | cut -d' ' -f1)
          test "$actual" = "$expected"
          image='${{ needs.package.outputs.image }}@${{ needs.package.outputs.image_digest }}'
          if [[ "$target" == mini-production ]]; then
            host="$OBSERVABILITY_PACKAGE_DIR/host-package"
            bundle=$(sha256sum "$host/artifact.tar" | cut -d' ' -f1)
            [[ "$bundle" =~ ^[0-9a-f]{64}$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
            python3 - "$host/manifest.json" "$bundle" "$GITHUB_SHA" "$image" <<'PYCODE'
          import json,sys
          manifest=json.load(open(sys.argv[1]))
          assert (manifest['schema'],manifest['installer_version'],manifest['target']) == ('project-paper.observability-host-package.v2',2,'mini-production')
          assert (manifest['artifact_sha256'],manifest['source_sha'],manifest['image']) == tuple(sys.argv[2:])
          PYCODE
            inbox=/var/lib/project-paper-observability/mini-production-incoming
            test -d "$inbox" && test ! -L "$inbox"
            staged="$inbox/$bundle-$GITHUB_SHA"
            if [[ -e "$staged" || -L "$staged" ]]; then
              test -d "$staged" && test ! -L "$staged"
              test "$(stat -c %u "$staged")" = "$(id -u)"
              previous="$staged.previous-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              test ! -e "$previous" && test ! -L "$previous"
              mv -- "$staged" "$previous"
            fi
            upload="$inbox/.upload-$bundle-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            test ! -e "$upload" && test ! -L "$upload"
            mkdir -m 0700 "$upload"
            install -m 0600 "$host/artifact.tar" "$host/manifest.json" "$host/attestation.jsonl" "$upload/"
            mv -- "$upload" "$staged"
            # Root independently verifies signatures and snapshots these bytes.
            # Failure deliberately leaves inputs for audit and safe retry.
            sudo -n /usr/local/sbin/project-paper-observability-package-install --target mini-production --bundle "$bundle" --source-sha "$GITHUB_SHA"
            if rm -f -- "$staged/artifact.tar" "$staged/manifest.json" "$staged/attestation.jsonl" && rmdir -- "$staged"; then
              echo 'signed_inbox_cleanup=complete'
            else
              echo 'signed_inbox_cleanup=incomplete evidence retained' >&2
            fi
          else
            sudo -n /usr/local/sbin/project-paper-observability-deploy --image "$image" --target "$target"
          fi
