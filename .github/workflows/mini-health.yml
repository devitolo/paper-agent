name: Mini Health Snapshot

"on":
  push:
    branches:
      - mini-production
  workflow_dispatch:
  schedule:
    - cron: "20 13 * * *"

permissions:
  contents: read

concurrency:
  group: mini-health-snapshot
  cancel-in-progress: false

jobs:
  health:
    name: Read-only production health
    runs-on:
      - self-hosted
      - project-paper-mini
      - linux
      - x64
    timeout-minutes: 10
    env:
      # Configure this runner/repository variable with the absolute private
      # production env-file path. The file is never printed or sourced here.
      PAPER_MINI_ENV_FILE: ${{ vars.PAPER_MINI_ENV_FILE }}
    steps:
      - name: Checkout trusted health script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Collect health snapshot
        id: snapshot
        shell: bash
        run: |
          set +e
          export PAPER_MINI_HEALTH_DIR="$RUNNER_TEMP/mini-health"
          export PAPER_MINI_HEALTH_OUTPUT="$PAPER_MINI_HEALTH_DIR/paper-health.json"
          mkdir -p "$PAPER_MINI_HEALTH_DIR"
          bash scripts/mini_health_snapshot.sh > "$RUNNER_TEMP/paper-health.txt" 2>&1
          result=$?
          if [[ ! -s "$PAPER_MINI_HEALTH_OUTPUT" ]]; then
            python3 - "$RUNNER_TEMP/paper-health.txt" "$PAPER_MINI_HEALTH_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          message = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").strip()
          Path(sys.argv[2]).write_text(
              json.dumps({"status": "critical", "collection_error": message}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          fi
          python3 scripts/mini_health_trend_summary.py "$PAPER_MINI_HEALTH_OUTPUT" \
            --jsonl "$PAPER_MINI_HEALTH_DIR/health-trend.jsonl" > "$PAPER_MINI_HEALTH_DIR/health-trend.txt"
          {
            echo "## Mini production health"
            echo
            echo "- Captured: $(date --iso-8601=seconds)"
            echo "- Runner: $(hostname)"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/paper-health.txt"
            echo
            echo "### Trend"
            echo
            echo '```text'
            cat "$PAPER_MINI_HEALTH_DIR/health-trend.txt"
            echo '```'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload machine-readable snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mini-health-${{ github.run_id }}
          path: ${{ runner.temp }}/mini-health
          if-no-files-found: ignore
          retention-days: 14

      - name: Mark attention required
        if: steps.snapshot.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Mini health reported an issue; review the step summary and snapshot artifact."
          exit 1
