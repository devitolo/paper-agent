name: Mini Non-Production

on:
  push:
    branches:
      - mini-nonprod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-nonprod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate non-prod contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run isolated bootstrap tests
        run: |
          python3 -m unittest discover -s tests/mini_nonprod -v
          git diff --check

  build:
    name: Build and accept Mini non-prod image
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record source bundle
        id: source
        run: echo "bundle=$(git archive --format=tar HEAD | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Build and publish AMD64 non-prod image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:mini-nonprod-${{ github.sha }}
          labels: |
            org.projectpaper.environment=mini-nonproduction
            org.projectpaper.source-bundle-sha256=${{ steps.source.outputs.bundle }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=mini-nonprod-${{ github.sha }}
            SOURCE_BUNDLE_SHA256=${{ steps.source.outputs.bundle }}
      - name: Accept exact digest against synthetic fixture
        id: ref
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${IMAGE}@${IMAGE_DIGEST}"
          python3 scripts/mini_nonprod_fixture.py "$RUNNER_TEMP/mini-nonprod-fixture"
          docker pull "$image"
          docker run --rm --network none --user 10001:10001 \
            -e PAPER_AGENT_PACKAGED=1 -e PAPER_AGENT_SERVING_ONLY=1 \
            -e PAPER_AGENT_STARTUP_MODE=serving -e PAPER_NON_PRODUCTION=1 \
            -e PAPER_AGENT_SCHEDULER_ENABLED=0 -e PAPER_AGENT_LIFECYCLE_DIR=/app/control \
            -v "$RUNNER_TEMP/mini-nonprod-fixture/data:/app/data:ro" \
            -v "$RUNNER_TEMP/mini-nonprod-fixture/config:/app/config:ro" \
            -v "$RUNNER_TEMP/mini-nonprod-fixture/control:/app/control:ro" \
            -v "$RUNNER_TEMP/mini-nonprod-fixture/generated:/app/generated:ro" \
            -v "$RUNNER_TEMP/mini-nonprod-fixture/logs:/app/logs:ro" \
            "$image" check-state
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "## Mini non-prod image"
            echo
            echo "- Image: \`$image\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- State: synthetic fixture only"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy isolated stack to Mini
    needs: build
    if: github.ref == 'refs/heads/mini-nonprod'
    runs-on: [self-hosted, project-paper-mini, linux, x64]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment: mini-nonprod
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy exact non-prod digest
        env:
          PAPER_MINI_NONPROD_IMAGE: ${{ needs.build.outputs.image }}
        run: bash scripts/mini_nonprod_update.sh
