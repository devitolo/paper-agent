name: Backup Restore

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/backup-restore.yml
      - scripts/package_backup.sh
      - scripts/package_backup/**
      - tests/package_backup_docker.py
      - tests/test_package_backup.py

permissions:
  contents: read

concurrency:
  group: backup-restore-linux-amd64
  cancel-in-progress: false

jobs:
  linux-amd64:
    name: Ubuntu x86-64 same-image backup and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Record tested environment
        shell: bash
        run: |
          mkdir -p backup-restore-results
          {
            uname -a
            cat /etc/os-release
            docker version
            docker compose version
            python3 --version
            git rev-parse HEAD
            cat .env.example
          } > backup-restore-results/environment.txt
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Unit safety checks
        run: |
          python3 -m unittest tests.test_package_backup
          bash -n scripts/package_backup.sh

      - name: Run published-image backup and restore drill
        shell: bash
        env:
          PAPER_BACKUP_EVIDENCE_DIR: ${{ github.workspace }}/backup-restore-results
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python3 tests/package_backup_docker.py 2>&1 | tee backup-restore-results/drill.log

      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-paper-linux-backup-restore-${{ github.run_id }}
          path: backup-restore-results/
          if-no-files-found: error
          retention-days: 14
