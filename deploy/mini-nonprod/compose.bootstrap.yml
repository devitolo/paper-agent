# Standalone contract. Never combine with a production Compose file.
name: paper-mini-nonprod
services:
  app:
    image: ${PAPER_MINI_NONPROD_IMAGE:?Supply approved immutable AMD64 registry digest}
    platform: linux/amd64
    pull_policy: never
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    labels:
      org.projectpaper.environment: mini-nonproduction
      org.projectpaper.state: synthetic-only
    environment:
      PAPER_APP_IMAGE: ${PAPER_MINI_NONPROD_IMAGE:?Supply approved immutable AMD64 registry digest}
      PAPER_AGENT_PACKAGED: "1"
      PAPER_AGENT_SERVING_ONLY: "1"
      PAPER_AGENT_STARTUP_MODE: serving
      PAPER_AGENT_LIFECYCLE_DIR: /runtime-control
      PAPER_AGENT_SCHEDULER_ENABLED: "0"
      PAPER_GENERATED_OUTPUT_DIR: /app/generated
      PAPER_DEPLOYMENT_ENV: non-production
      PAPER_NON_PRODUCTION: "1"
      PAPER_UI_ENV_LABEL: MINI NON-PROD — SYNTHETIC
      PAPER_AGENT_GEMINI_ENABLED: "0"
      PAPER_AGENT_TELEMETRY: "0"
      PAPER_AGENT_MINILM_ENABLED: "0"
      PAPER_AGENT_SYNC_ENVIRONMENT: mini-nonprod
      PAPER_AGENT_SYNC_PRODUCER: mini-nonprod-disabled
      PAPER_AGENT_SYNC_SHARED_SECRET: ""
      PAPER_AGENT_OLLAMA_URL: http://127.0.0.1:9
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    ports: ["127.0.0.1:18080:8000"]
    expose: ["8000"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    volumes:
      - data:/app/data
      - config:/app/config
      - logs:/app/logs
      - control:/runtime-control
      - generated:/app/generated
    networks: [isolated]
    healthcheck:
      test: [CMD, python, -m, paper_agents.package_runtime, check-app]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
networks:
  isolated:
    name: paper-mini-nonprod-internal
    internal: true
    labels:
      org.projectpaper.environment: mini-nonproduction
volumes:
  data:
    external: true
    name: paper-mini-nonprod-data
  config:
    external: true
    name: paper-mini-nonprod-config
  logs:
    external: true
    name: paper-mini-nonprod-logs
  control:
    external: true
    name: paper-mini-nonprod-runtime-control
  generated:
    external: true
    name: paper-mini-nonprod-generated
