name: Observability Publisher Image Build
on:
  push:
    branches: [codex/observability-transport-contract]
    paths:
      - .github/workflows/observability-publisher-build.yml
      - deploy/observability/Dockerfile.publisher
      - paper_agents/observability_transport.py
      - paper_agents/observability_publisher.py
permissions: {}
concurrency:
  group: project-paper-publisher-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate isolated backend
        run: python3 -m unittest tests.test_observability_transport -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect python:3.12-slim --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=python:3.12-slim@$digest" >> "$GITHUB_OUTPUT"
      - name: Publish AMD64 publisher
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/observability/Dockerfile.publisher
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/devitolo/paper-agent/observability-publisher:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: BASE_IMAGE=${{ steps.base.outputs.image }}
      - name: Record immutable identity
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          BASE: ${{ steps.base.outputs.image }}
        run: |
          printf 'source=%s\nimage=ghcr.io/devitolo/paper-agent/observability-publisher@%s\nbase=%s\n' "$GITHUB_SHA" "$DIGEST" "$BASE" > publisher-image.txt
          cat publisher-image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: observability-publisher-${{ github.sha }}
          path: publisher-image.txt
          if-no-files-found: error
          retention-days: 14
