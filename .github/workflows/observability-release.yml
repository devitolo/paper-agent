name: Project Paper Observability Release

on:
  push:
    tags:
      - 'observability-mini'
      - 'observability-aws'

permissions: {}
concurrency:
  group: project-paper-observability-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate standalone package
        run: |
          python3 -m unittest tests.test_host_resource_collector tests.test_resource_status tests.test_observability_release tests.test_observability_container tests.test_observability_aws_p1 tests.test_observability_collect_publish tests.test_observability_package tests.test_observability_host_package_build -v
          bash -n scripts/resource_collector_job.sh scripts/install_resource_collector_cron.sh scripts/remove_resource_collector_cron.sh deploy/observability/*.sh
          test -s deploy/observability/Dockerfile
          test -s deploy/observability/entrypoint.sh
          test -s deploy/observability/run-container.sh
          git diff --check

  package:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
      sha256: ${{ steps.archive.outputs.sha256 }}
      image: ${{ steps.image.outputs.image }}
      image_digest: ${{ steps.image.outputs.digest }}
      host_digest: ${{ steps.host.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: archive
        name: Build immutable observability package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-observability-${GITHUB_SHA}}"
          archive="project-paper-observability-${tag}.tar.gz"
          tar -czf "$archive" scripts/host_resource_collector.py deploy/observability/Dockerfile deploy/observability/entrypoint.sh deploy/observability/run-container.sh deploy/observability/install_container_cron.sh deploy/observability/remove_container_cron.sh deploy/observability/recovery-common.sh deploy/observability/cron.example deploy/observability/project-paper-observability-deploy deploy/observability/sudoers.project-paper-observability deploy/observability/collect-publish.sh deploy/observability/install_collect_publish.sh deploy/observability/install_package.sh docs/observability-collect-publish.md docs/mini-resource-collector-operations.md
          sha=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          printf 'package=%s\nsha256=%s\nrevision=%s\n' "$archive" "$sha" "$GITHUB_SHA" > observability-release-evidence.txt
      - id: host
        name: Build bounded Mini host package
        if: github.ref_name == 'observability-mini'
        run: |
          set -euo pipefail
          digest=$(python3 scripts/build_observability_host_package.py --source-sha "$GITHUB_SHA" --output-directory host-package)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: attest_host
        if: github.ref_name == 'observability-mini'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: |
            host-package/artifact.tar
            host-package/manifest.json
      - name: Preserve host attestation bundle
        if: github.ref_name == 'observability-mini'
        env:
          BUNDLE_PATH: ${{ steps.attest_host.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" host-package/attestation.jsonl
      - id: image
        name: Build and publish immutable AMD64 image
        shell: bash
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/observability:${GITHUB_REF_NAME}"
          printf '%s' "$CR_PAT" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build --platform linux/amd64 --push -f deploy/observability/Dockerfile -t "$image" .
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [[ "$digest" = sha256:* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'image=%s@%s\n' "$image" "$digest" >> observability-release-evidence.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: project-paper-observability-${{ github.sha }}
          path: |
            ${{ steps.archive.outputs.archive }}
            observability-release-evidence.txt
            host-package/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: package
    if: needs.package.result == 'success' && github.event_name == 'push' && (github.ref_name == 'observability-mini' || github.ref_name == 'observability-aws')
    environment:
      name: ${{ github.ref_name == 'observability-mini' && 'observability-mini-production' || 'observability-aws-production' }}
    runs-on: ${{ github.ref_name == 'observability-mini' && fromJSON('["self-hosted","linux","x64","project-paper-observability-mini-deploy"]') || fromJSON('["self-hosted","linux","x64","project-paper-observability-aws-deploy"]') }}
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: project-paper-observability-${{ github.sha }}
          path: /tmp/project-paper-observability-package
      - name: Require explicit release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" = tag ]] || { echo 'observability deploy requires a target-specific tag' >&2; exit 64; }
          case "$GITHUB_REF_NAME" in
            observability-mini) target=mini-production ;;
            observability-aws) target=aws-production ;;
            *) echo 'tag must be exactly observability-mini or observability-aws' >&2; exit 64 ;;
          esac
          echo "target=$target"
          echo "target=$target" >> "$GITHUB_ENV"
      - name: Check host resources and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v sudo >/dev/null
          command -v docker >/dev/null
          command -v flock >/dev/null
          df -Pk /var/lib /opt /etc
          free -b || true
      - name: Require independently provisioned Mini host upgrade capability
        if: github.ref_name == 'observability-mini'
        run: |
          set -euo pipefail
          for path in /usr/local/sbin/project-paper-observability-package-install /usr/local/libexec/project-paper-observability/gh; do
            test -f "$path" && test ! -L "$path" && test -x "$path"
            test "$(stat -c %u "$path")" = 0
            mode=$(stat -c %a "$path")
            (( (8#$mode & 022) == 0 ))
          done
          test -d /var/lib/project-paper-observability/mini-production-incoming
      - name: Upgrade Mini host code through fixed attestation verifier
        if: github.ref_name == 'observability-mini'
        env:
          HOST_DIGEST: ${{ needs.package.outputs.host_digest }}
        run: |
          set -euo pipefail
          [[ "$HOST_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          package=/tmp/project-paper-observability-package/host-package
          test "$(sha256sum "$package/artifact.tar" | cut -d' ' -f1)" = "$HOST_DIGEST"
          inbox=/var/lib/project-paper-observability/mini-production-incoming
          staged=$(mktemp -d "$inbox/.upload-XXXXXXXX")
          trap 'rm -rf -- "$staged"' EXIT
          install -m 0600 "$package/artifact.tar" "$package/manifest.json" "$package/attestation.jsonl" "$staged/"
          # Never overwrite an existing inbox: a retained bundle requires audit.
          test ! -e "$inbox/$HOST_DIGEST-$GITHUB_SHA" && test ! -L "$inbox/$HOST_DIGEST-$GITHUB_SHA"
          mv -T "$staged" "$inbox/$HOST_DIGEST-$GITHUB_SHA"
          trap - EXIT
          sudo -n /usr/local/sbin/project-paper-observability-package-install --target mini-production --bundle "$HOST_DIGEST" --source-sha "$GITHUB_SHA"
          rm -rf -- "$inbox/$HOST_DIGEST-$GITHUB_SHA"
      - name: Deploy package through host installer
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find /tmp/project-paper-observability-package -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          expected='${{ needs.package.outputs.sha256 }}'
          actual=$(sha256sum "$archive" | cut -d' ' -f1)
          test "$actual" = "$expected"
          image='${{ needs.package.outputs.image }}@${{ needs.package.outputs.image_digest }}'
          sudo -n /usr/local/sbin/project-paper-observability-deploy --image "$image" --target "$target"
