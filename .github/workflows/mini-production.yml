name: Mini Production

on:
  pull_request:
    branches:
      - mini-production
  push:
    branches:
      - mini-production
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_BRANCH: mini-production
  MINI_TARGET: mini-production

permissions:
  contents: read

concurrency:
  group: mini-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check Compose configuration tooling
        run: docker compose version

      - name: Run deployment safety tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ".:tests"
        run: |
          python3 -m unittest \
            tests.test_curator_v3 \
            tests.test_curator_interest \
            tests.test_mini_release_pipeline \
            tests.test_migration_foundations \
            tests.test_migration_gemini \
            tests.test_migration_scheduler \
            tests.test_mini_container_job \
            tests.test_core_progress \
            tests.test_rehearsal_images \
            tests.test_import_legacy_schema \
            tests.test_semantic_scholar_key_failover \
            tests.test_semantic_scholar_failover_qa \
            tests.test_semantic_scholar_env_wiring_qa \
            tests.test_semantic_scholar_cooldown \
            tests.test_semantic_scholar_four_page_experiment \
            tests.test_semantic_scholar_progress \
            tests.test_scout_diagnostics \
            tests.test_sync_health \
            tests.test_mini_health_trend \
            -v

  build:
    name: Build and publish Mini image
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}
      source_bundle_sha256: ${{ steps.source.outputs.source_bundle_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compute source bundle hash
        id: source
        shell: bash
        run: |
          git archive --format=tar HEAD | sha256sum | awk '{ print "source_bundle_sha256=" $1 }' >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=mini-sha-
            type=raw,value=mini-${{ github.sha }}

      - name: Build and publish amd64 Mini production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ env.MINI_TARGET }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=mini-${{ github.sha }}
            SOURCE_BUNDLE_SHA256=${{ steps.source.outputs.source_bundle_sha256 }}
          cache-from: type=gha,scope=mini-production
          cache-to: type=gha,mode=min,scope=mini-production
          provenance: mode=max
          sbom: true

      - name: Export immutable image reference
        id: ref
        shell: bash
        run: |
          echo "image_ref=${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          {
            echo "## Mini image"
            echo
            echo "- Image: \`${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Mini
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/mini-production') || github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - project-paper-mini
      - linux
      - x64
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    environment:
      name: mini-production
    steps:
      - name: Checkout trusted deployment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm production runner identity
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          docker version
          docker compose version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy exact image to Mini
        shell: bash
        env:
          PAPER_MINI_APP_IMAGE: ${{ needs.build.outputs.image_ref }}
          PAPER_MINI_ENV_FILE: ${{ vars.PAPER_MINI_ENV_FILE }}
          PAPER_MINI_DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          PAPER_MINI_DRAIN_TIMEOUT: "1800"
          PAPER_MINI_ARXIV_PROGRESS: "1"
          PAPER_MINI_OPENALEX_CURSOR: "1"
          PAPER_MINI_SEMANTIC_SCHOLAR_PROGRESS: "1"
          PAPER_MINI_SEMANTIC_SCHOLAR_FOUR_PAGE_EXPERIMENT: "1"
          PAPER_MINI_CORE_SOURCE: "1"
        run: bash scripts/mini_production_update.sh
